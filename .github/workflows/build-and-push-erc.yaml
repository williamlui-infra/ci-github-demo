name: Build and Push Demo App image to ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build, tag, and push image to Amazon ECR
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          printf '%s' "${{ secrets.DEV_WILLIAM_DEMO_TOKEN }}" | docker login --username AWS --password-stdin "${{ vars.MY_ECR }}"
          echo "${{ vars.MY_ECR }}/${{ vars.MY_REPO }}/${{ vars.MY_APP }}:$IMAGE_TAG"
          docker build -t "${{ vars.MY_ECR }}/${{ vars.MY_REPO }}/${{ vars.MY_APP }}:$IMAGE_TAG" .
          docker push "${{ vars.MY_ECR }}/${{ vars.MY_REPO }}/${{ vars.MY_APP }}:$IMAGE_TAG"
